<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Activities & News | Somali Diabetes Foundation</title>

  <meta
    name="description"
    content="Activities, community outreach, diabetes awareness, screening, education, partnerships and events of the Somali Diabetes Foundation."
  >

  <meta name="theme-color" content="#063b68">

  <style>
    :root {
      --navy: #063b68;
      --navy-dark: #042d50;
      --blue: #159ed0;
      --green: #18b957;
      --light: #f4f9fb;
      --white: #ffffff;
      --ink: #18313b;
      --muted: #637782;
      --border: #e2edf1;
      --shadow: 0 12px 35px rgba(6, 59, 104, 0.10);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--white);
      line-height: 1.7;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img {
      display: block;
      width: 100%;
    }

    /* =====================================================
       HEADER — MATCHES THE NEW SDF WEBSITE HEADER
    ===================================================== */

    header {
      background: rgba(255, 255, 255, 0.98);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav {
      max-width: 1280px;
      margin: auto;
      min-height: 84px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 8px 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand-logo {
      width: 68px;
      height: 68px;
      object-fit: cover;
      border-radius: 11px;
      background: #eeeeee;
      border: 1px solid #e1e1e1;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.05;
    }

    .brand-name {
      color: var(--navy);
      font-weight: 800;
      font-size: 20px;
      white-space: nowrap;
    }

    .brand-acronym {
      color: var(--blue);
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-top: 5px;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }

    nav a {
      color: var(--ink);
      font-weight: 700;
      font-size: 14px;
      padding: 9px 9px;
      border-radius: 8px;
      white-space: nowrap;
      transition: 0.2s ease;
    }

    nav a:hover,
    nav a.active {
      color: var(--blue);
      background: var(--light);
    }

    nav a.donate {
      color: var(--white);
      background: var(--green);
      padding: 12px 18px;
      margin-left: 5px;
      border-radius: 10px;
      font-size: 15px;
    }

    nav a.donate:hover {
      color: var(--white);
      background: #119e48;
    }

    /* =====================================================
       HERO
    ===================================================== */

    .hero {
      background:
        linear-gradient(
          135deg,
          rgba(6, 59, 104, 0.96),
          rgba(21, 158, 208, 0.88)
        );

      color: var(--white);
      padding: 78px 25px 82px;
    }

    .hero-inner {
      max-width: 1100px;
      margin: auto;
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 7px 16px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 18px;
    }

    .hero h1 {
      font-size: clamp(42px, 6vw, 64px);
      line-height: 1.08;
      margin-bottom: 20px;
      font-weight: 800;
    }

    .hero p {
      max-width: 820px;
      margin: auto;
      font-size: 19px;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.92);
    }

    /* =====================================================
       INTRO
    ===================================================== */

    .intro {
      max-width: 1050px;
      margin: auto;
      padding: 68px 25px 30px;
      text-align: center;
    }

    .intro h2 {
      color: var(--navy);
      font-size: 34px;
      line-height: 1.2;
      margin-bottom: 15px;
    }

    .intro p {
      max-width: 850px;
      margin: auto;
      color: var(--muted);
      font-size: 17px;
    }

    /* =====================================================
       ACTIVITY SECTIONS
    ===================================================== */

    .activity-section {
      max-width: 1180px;
      margin: auto;
      padding: 55px 25px;
    }

    .section-heading {
      margin-bottom: 28px;
    }

    .section-heading .label {
      color: var(--green);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .section-heading h2 {
      color: var(--navy);
      font-size: 34px;
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .section-heading p {
      max-width: 820px;
      color: var(--muted);
      font-size: 16px;
    }

    /* =====================================================
       PHOTO GRID
    ===================================================== */

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .photo-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
      cursor: pointer;
    }

    .photo-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 18px 45px rgba(6, 59, 104, 0.16);
    }

    .photo-wrap {
      height: 245px;
      overflow: hidden;
      background: #eaf2f5;
    }

    .photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .photo-card:hover img {
      transform: scale(1.04);
    }

    .photo-info {
      padding: 17px 18px 19px;
    }

    .photo-info h3 {
      color: var(--navy);
      font-size: 17px;
      line-height: 1.35;
      margin-bottom: 5px;
    }

    .photo-info p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    /* =====================================================
       FEATURED ACTIVITY
    ===================================================== */

    .featured {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 30px;
      align-items: center;

      background: var(--light);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 35px;
    }

    .featured-image {
      height: 390px;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
    }

    .featured-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .featured-content h3 {
      color: var(--navy);
      font-size: 29px;
      line-height: 1.25;
      margin-bottom: 15px;
    }

    .featured-content p {
      color: var(--muted);
      margin-bottom: 15px;
    }

    .tag {
      display: inline-block;
      background: #e2f7eb;
      color: #087b37;
      font-size: 12px;
      font-weight: 800;
      padding: 6px 11px;
      border-radius: 50px;
      margin-bottom: 14px;
    }

    /* =====================================================
       DIVIDER
    ===================================================== */

    .divider {
      max-width: 1130px;
      height: 1px;
      background: var(--border);
      margin: 0 auto;
    }

    /* =====================================================
       CTA
    ===================================================== */

    .cta {
      background: var(--navy);
      color: var(--white);
      padding: 70px 25px;
      margin-top: 35px;
    }

    .cta-inner {
      max-width: 900px;
      margin: auto;
      text-align: center;
    }

      font-size: 36px;
      line-height:
